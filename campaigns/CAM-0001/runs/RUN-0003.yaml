factual_outcome: >-
  The recent effect survived severe daily-bar cost stress and extra latency.
  At 20 bps per side, SMA20/SMA50 still averaged 11.88%/10.89% monthly over
  12 months, though each rose to four negative months. A two-session entry
  delay did not weaken returns. Lookbacks 3/5/10 were directionally consistent,
  while a seven-day hold fell to 8.21%/8.80% average monthly and had worse
  drawdown; the edge appears to need roughly two weeks to develop. Both funds
  were independently positive, but SOXL-only produced 17.38%-18.12% average
  monthly versus TQQQ-only 6.09%-6.30%, confirming substantial semiconductor
  concentration. In the joint core, the top five profitable legs supplied
  64.7%-71.6% of 12-month net, 20-21 independent decisions existed, and full
  recovery remained 599-821 days. Recent recovery was 78-79 days, missing the
  preferred one-month profile.
decision: >-
  Continue. Execution margin and nearby formation definitions are credible,
  but recovery, SOXL dependence, limited independent decisions, and the abrupt
  pre-May-2025 weakness block candidate status. Test causal signal-invalidation
  exits and then regime/selectability evidence.
next_question: >-
  Can a predeclared daily signal-invalidation exit reduce loss duration and
  recovery without sacrificing the broad cost/delay robustness or merely
  overfit the recent reversals?
