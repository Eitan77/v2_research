change_from_parent: >-
  Batch a prespecified mechanism-diagnostic family across broad formation,
  confirmation, holding, and breadth choices.
reason: >-
  RUN-0001 had strong magnitude but severe month-to-month reversals, late exits,
  and SOXL concentration. Shorter confirmation and holding horizons may react
  faster to trend failure; longer formation may reject noise; breadth two tests
  whether selection concentration is obscuring a shared persistence effect.
expected_effect: >-
  A genuine persistence mechanism should show a neighborhood with positive
  12/15/18-month net returns, improved negative-month count and drawdown, and
  contribution from both funds. If only isolated SOXL/top-one variants work,
  the mechanism is likely concentrated beta rather than a robust selector.

