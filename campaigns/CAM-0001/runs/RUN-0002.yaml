factual_outcome: >-
  The mechanism improved as a broad neighborhood, not at one isolated point.
  Four of 96 variants jointly reached >=10% 12-month average monthly net,
  <20% 12-month drawdown, and <=3 negative months. Three were the same
  lookback-5/holding-10/breadth-2 construction with QQQ SMA 20, 50, or 100:
  12-month average monthly net 12.39%/11.41%/10.61%, median month
  13.75%/12.04%/8.69%, three negative months each, and drawdown
  13.86%/15.18%/16.19%. Both funds contributed positively. The 15- and
  18-month averages fell to 5.57%-8.10% and 3.85%-6.61%, so a recent onset is
  possible but not established. A fourth one-day top-one variant had 89.82%
  full-history drawdown and is not credible. Longer QQQ confirmation worsened
  full-history drawdown, while the SMA-20 member had 28.51% full drawdown.
decision: >-
  Continue with the robust lookback-5/holding-10/breadth-2 neighborhood,
  emphasizing SMA 20 and 50 rather than selecting the highest recent return.
  Audit path, costs, delay, concentration, underlying-vs-leveraged alpha,
  regime onset, and neighboring signal definitions before candidate status.
next_question: >-
  Does the 5-day formation/10-day equal-weight continuation family survive
  adverse costs, one-session extra latency, component and leave-one-out tests,
  and causal regime diagnostics without relying on the chosen recent endpoint?
