change_from_parent: >-
  Replace failed exit intervention with causal entry-state diagnostics for
  broad participation, QQQ momentum, rising trend, orderly volatility, and
  trend efficiency.
reason: >-
  Fixed holds work better than reacting to ordinary reversals. The unresolved
  weakness may instead be entering rebound noise rather than persistent
  information/flow states, especially before the apparent recent regime.
expected_effect: >-
  A valid activation state should improve 12/15/18-month consistency and
  recovery across SMA 20 and 50, retain meaningful sample size, and show
  directionally useful full-history behavior. A filter that only removes the
  pre-May-2025 losses or sharply shrinks entries is not adequate.

