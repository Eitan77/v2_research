factual_outcome: >-
  Causal state filters did not manufacture a perfect path. Requiring the QQQ
  SMA to be rising was the most balanced result: 10.55% 12-month average
  monthly net, 11.24% median month, three negative months, 12.85% drawdown,
  and improved 15/18-month averages of 8.59%/6.13% with 3/5 negative months.
  It removed 19 of 141 full-history entries and lowered full drawdown from
  28.51% to 25.83%, but recent recovery remained 85 days. Participation plus
  trend efficiency cut negative months to two and drawdown to 11.11%, but
  reduced average monthly net to 8.55%, removed 65 entries, and lengthened
  recovery to 168 days. Volatility filters harmed the edge. No filter supports
  an honest claim that the regime began exactly at the favorable 12-month start.
decision: >-
  Retain rising-SMA as a plausible activation candidate, not a selected final
  rule. Continue with causal risk sizing, universe/leg alternatives, and
  chronological evidence. Do not claim candidate status from the fixed 12-month
  endpoint.
next_question: >-
  Can continuous volatility-aware exposure or component weighting improve
  recovery and SOXL concentration while preserving about 10% recent average
  monthly net across the broader 15/18-month context?
