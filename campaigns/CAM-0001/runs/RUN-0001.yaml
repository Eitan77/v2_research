factual_outcome: >-
  Full history gained 349.15% net simple with 26.48% standard drawdown, but the
  recent path is not a consistent money printer. The predeclared 18/15/12-month
  views returned 124.38%/149.57%/168.48% (6.91%/9.97%/14.04% average monthly)
  with 9/8/6 negative months and recent-window maximum drawdowns of
  65.02%/35.37%/22.02%. The 12-month median month was only 0.73%. SOXL supplied
  91.8% of full-period net contribution and more than 100% of 12-month net
  contribution while TQQQ lost slightly. Large positive and negative months
  dominate; the result is concentrated embedded leverage, not yet exceptional
  repeatable income.
decision: >-
  Continue. The mechanism has strong gross economic magnitude but weak
  consistency, slow recovery, concentration, and likely late trend exits.
  Diagnose horizon and confirmation jointly before adding risk overlays.
next_question: >-
  Do broad, mechanism-consistent lookback/holding/trend-confirmation choices
  improve the complete monthly path and drawdown across both funds and
  chronological periods, or is the apparent edge simply SOXL beta?
