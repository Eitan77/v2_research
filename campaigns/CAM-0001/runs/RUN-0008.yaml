factual_outcome: >-
  The final fixed 12-month view is unusually favorable: it ranks at the 98.7th
  percentile among 77 rolling 12-month endpoints, and only 2 endpoints jointly
  achieved >=10% average month, <=3 negative months, and <20% drawdown. The
  12-month candidate produced 126.63% net, 10.55% average and 11.24% median
  month, three negative months, 12.85% drawdown, and 19 non-overlapping entry
  decisions. The top decision supplied 25.6% and top five 87.0% of net.
  Event-bootstrap 95% net interval was 32.6%-226.4% with 0.315% nonpositive
  probability, but only 54.8% of resamples reached 10% average monthly and the
  bootstrap does not correct the 171-variant selection. The 15-month view is
  more representative: 8.59% average month, three negatives, and 12.70%
  drawdown. The candidate improved risk versus unconditional fixed-notional
  leveraged exposure (15m drawdown 12.70% versus 84.47%) but returned less
  (8.59% versus 9.72% average month); in the favorable 12m, unconditional
  exposure returned 17.03% average month at 16.31% drawdown. Shadow 3m/6m
  decay gates added many zero months and did not improve recovery. The candidate
  ended 5.60% below its April 27 equity peak; the longest recent recovery was
  85 days.
decision: >-
  Do not freeze or promote yet. The mechanism and cost margin are real, but the
  headline window is a near-extreme endpoint, contributor concentration is
  high, the honest 15-month return is below the nominal objective, and recovery
  remains too slow. Complete one broad price-stop audit and execution evidence
  before the conclusion audit.
next_question: >-
  Can broad, realistically gap-filled protective stops shorten the 85-day
  recovery without simply truncating the two-week continuation payoff?
