factual_outcome: >-
  Signal-invalidation exits did not solve recovery. Fund-momentum or combined
  invalidation roughly halved utilization and cut 12-month average monthly net
  to about 4.9%-5.3%, while worsening drawdown/recovery. Market-only
  invalidation retained more return but delivered 7.17%/9.52% average monthly
  and 170-183-day recent recovery. The fixed 10-session exit remained superior
  at both 5 and 20 bps per side. This falsifies the idea that slow reaction to
  a daily signal reversal caused the main recovery weakness; normal interim
  reversals appear part of the continuation payoff.
decision: >-
  Reject daily invalidation exits and retain the fixed 10-session exit. Diagnose
  causal entry-state selectivity and regime activation rather than fitting a
  stop or exit to observed losses.
next_question: >-
  Can broad causal participation, market-momentum, trend-quality, or volatility
  states distinguish persistent flows from unstable rebounds across the full
  chronology and improve recent recovery without favorable date selection?
