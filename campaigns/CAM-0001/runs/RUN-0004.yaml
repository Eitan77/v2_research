change_from_parent: >-
  Add causal daily signal-invalidation exits while preserving the 10-session
  maximum hold and original decision-block schedule.
reason: >-
  RUN-0003 retained strong cost/delay performance but recent recovery lasted
  78-79 days. Large losses followed positive short-term momentum that reversed
  during the fixed hold. Exiting next open after the market trend, fund
  momentum, or either condition invalidates directly targets that mechanism.
expected_effect: >-
  A valid invalidation rule should shorten recovery and reduce drawdown across
  SMA 20 and 50 without destroying average/median months, and should survive
  20 bps per side. If it only removes a few observed losses while damaging
  other periods, retain the simpler fixed exit.

