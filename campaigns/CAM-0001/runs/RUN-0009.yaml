factual_outcome: >-
  All protective stops failed the stated purpose. For SMA20, 10%/15%/20% stops
  reduced 12-month average monthly net from 10.55% to 7.57%/7.19%/8.21% at
  mild stop slippage, increased drawdown from 12.85% to
  16.85%/18.90%/20.73%, and lengthened recovery from 85 to 173-177 days.
  SMA50 behaved similarly. Gap fills occurred 3-14 times and worse stop
  slippage degraded results further. The continuation payoff requires tolerating
  substantial normal path variation; price stops are not a credible fix.
decision: >-
  Reject price stops and retain the no-stop fixed-hold structure. No further
  mechanism-consistent risk overlay is supported by the diagnosed loss path.
  Proceed to SIP quote execution qualification.
next_question: >-
  Do actual recent SIP NBBO entry/exit prices at process-justified 1-, 5-, and
  30-second post-open latencies preserve the bar-screen result and adequate
  displayed size?
