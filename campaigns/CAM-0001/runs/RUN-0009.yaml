change_from_parent: >-
  Test broad 10%, 15%, and 20% protective price stops with realistic gap fills
  and 10/100 bps adverse stop slippage across SMA20 and SMA50.
reason: >-
  Daily signal invalidation and risk sizing failed, but the remaining 85-day
  recovery could reflect a few large within-hold leveraged losses. A broad
  protective stop directly caps that path while preserving the intended
  two-week continuation until a material adverse move occurs.
expected_effect: >-
  A useful stop should reduce recent recovery and drawdown across both
  confirmation neighbors and adverse stop slippage without sharply lowering
  average/median month. If it truncates normal variation or only helps one
  threshold, retain no stop.

