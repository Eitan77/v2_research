factual_outcome: >-
  The bullish continuation direction exists in unleveraged QQQ/SMH but at
  roughly one-third the magnitude: 3.70% 12-month average monthly net, 6.14%
  drawdown, the same three negative months, and the same 85-day recovery.
  This supports a real directional mechanism but shows the A-profile headline
  is largely embedded leverage. Long inverse SQQQ/SOXS variants were
  catastrophically negative (best recent average -3.30%; full equity loss
  exceeded the original capital), and regime switches inherited those losses,
  reaching 22%-25% recent drawdown and much worse full-history risk. No direct
  shorts were used.
decision: >-
  Reject the bearish inverse leg and regime switch. Retain bullish leveraged
  continuation as the only viable expression, explicitly labeled as leveraged
  amplification of a smaller underlying edge.
next_question: >-
  Does the adapted SMA20 rising candidate have sufficient chronological,
  concentration, benchmark-relative, and selection-adjusted evidence to justify
  freezing for forward confirmation, and can a causal shadow-decay monitor
  improve prospective retirement without hindsight?
