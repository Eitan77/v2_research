factual_outcome: >-
  Equal fixed exposure remained best. The SOXL cap reduced 12-month average
  monthly net from 10.55% to 9.85% and slightly worsened drawdown without
  changing 85-day recovery. Inverse-volatility weighting fell to 9.25%, added
  a fourth negative month, and doubled recovery to 170 days. Continuous QQQ
  volatility scaling cut average monthly net to 7.10%-8.24% and did not shorten
  recovery. These changes lowered embedded beta but did not improve the actual
  loss path. Recent SOXL/TQQQ contributions under equal sizing were
  91.27%/35.36% of capital; the high return remains meaningfully semiconductor
  dependent.
decision: >-
  Reject risk-sizing changes as candidate improvements and retain transparent
  equal fixed-base sizing. Continue to the required asset/universe and bearish
  expression audit.
next_question: >-
  Is the effect genuine continuation across unleveraged proxies and bearish
  inverse products, or is the apparent A-profile return mainly a leveraged
  semiconductor bull-regime artifact?
