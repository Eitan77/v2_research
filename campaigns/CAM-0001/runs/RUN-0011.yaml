factual_outcome: >-
  The exact candidate retained 10.08% 12-month average monthly net simple
  return at 20 bps per side, but negative months rose from three to four and
  full-history drawdown/recovery worsened. A full extra-session entry delay
  reduced the 12-month average to 8.95%, raised drawdown to 14.36%, and doubled
  recent recovery to 176 days. The signal has cost margin but is sensitive to
  a materially different overnight entry process.
decision: >-
  No further in-sample refinement is justified. Retain the 5-bps next-open
  specification only as an adapted, execution-uncertain forward-paper candidate;
  do not promote it as an exceptional A-type strategy.
