mechanism_evidence:
  broad_baseline: >-
    A balanced 536-event baseline separated positive/negative gaps,
    continuation/failure, long, and protected intraday-short legs. Protected
    shorts lost; the best 10 bp baseline was positive-gap continuation to the
    five-session close at 0.864% average month and 7.30% drawdown.
  positive_sleeve: >-
    Positive gaps confirmed in the first 30 minutes drift most coherently after
    after-close announcements. The payoff forms a broad seven-to-nine-session
    plateau and survives entry at 10:05, but a concentrated cap50 expression
    has only roughly 41 allocated trades and three inactive months.
  negative_sleeve: >-
    Negative gaps that reclaim during the first 30 minutes recover most
    coherently when prior stock volatility is above its shifted state median.
    The payoff peaks around eight sessions and decays by ten, supporting a
    finite recovery clock. It is broader than one symbol but contributor
    dependence remains material.
  portfolio: >-
    Combining the two sleeves under one overlap-aware gross cap removes
    inactive months and raises recent return. Equal cap50 beats cap67/cap100,
    causal strength priority, and half-capital sleeve reservation. Extreme
    concentration reduces rather than reveals alpha.

