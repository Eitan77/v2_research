campaign_id: CAM-0007
run_id: RUN-0005
parent_run: RUN-0004
status: completed
frozen_at: "2026-07-29T05:48:00-07:00"
role: "Adversarial validation and campaign stopping gate"
adaptation_label: "three development-selected profiles; no untouched/OOS claim"

question: >-
  Do the best recent, full-history, and lower-concentration profiles remain
  credible after exact capacity-aware leave-one-out and moving-block
  uncertainty analysis, and is there any evidence they can meet the Type-A
  return objective without prohibited leverage or extreme concentration?
reason: >-
  Four prior runs covered source fidelity, event states, both long/short
  components, broad thresholds, all relevant horizons, entry latency, costs,
  sizing, overlap, and allocation. The remaining skeptical question is whether
  the modest best charts survive dependence and sequence perturbations.
expected_effect: >-
  A robust development candidate should remain positive after removing any
  symbol/event and under three-month moving-block bootstrap. The probability
  of a 10% average month will quantify whether Type-A is merely unobserved or
  incompatible with the measured mechanism under gross<=1.

frozen_profiles:
  recent_best:
    source: "RUN-0003"
    allocation_rule: equal_cohort
    positive_horizon: 4
    negative_horizon: 8
    entry_minute: "10:01"
    cost_bps_per_side: 10
    position_cap: 0.50
  full_history_stable:
    source: "RUN-0003"
    allocation_rule: equal_cohort
    positive_horizon: 5
    negative_horizon: 10
    entry_minute: "10:01"
    cost_bps_per_side: 10
    position_cap: 0.50
  lower_concentration:
    source: "RUN-0004"
    allocation_rule: strength_priority
    positive_horizon: 9
    negative_horizon: 7
    entry_minute: "10:01"
    cost_bps_per_side: 10
    position_cap: 0.33

frozen_validation:
  exact_reproduction: "Must match source daily/trade totals before validation."
  leave_one_symbol: "Remove each candidate symbol, rerun allocation and marked-to-market accounting."
  leave_one_event: "Remove each candidate event, rerun allocation and marked-to-market accounting."
  moving_block_bootstrap:
    replications: 20000
    seed: 7005
    block_months: 3
    samples:
      - "full 22-month development sequence"
      - "representative recent 15-month sequence"
    outputs:
      - "5th/50th/95th average-month quantiles"
      - "probability average month > 0"
      - "probability average month >= 10%"
  rolling_windows: [3, 6, 12]
  type_a_gate: >-
    Approximately 10%-15% average monthly net fixed-capital return with
    acceptable drawdown/recovery, monthly consistency, distributed
    contribution, execution robustness, and no gross exposure above 1.0.
  quote_replay_gate: >-
    Do not spend quote data on a candidate that remains a bar-stage Type-A
    loser; quote replay cannot rescue inadequate alpha.

required_outputs:
  - "Exact reproduction and all holdout/cutoff checks"
  - "LOO min/median/max results and identity of worst removal"
  - "20,000-rep bootstrap distributions for full and recent sequences"
  - "Worst/best rolling windows and chronological blocks"
  - "Mandatory conclusion audit and explicit retire/continue decision"

result:
  validation: "passed; all three profiles reproduced exactly"
  profiles:
    recent_best:
      recent_15m_average_month: 0.0316307256094353
      maximum_drawdown: 0.14429249436863362
      worst_symbol_loo_average_month: 0.02479413232387837
      recent_bootstrap_q05_median_q95: [0.0117618, 0.0318981, 0.0514213]
      recent_bootstrap_probability_positive: 0.9953
      recent_bootstrap_probability_at_least_10pct: 0.0
    full_history_stable:
      recent_15m_average_month: 0.028673928820958323
      full_average_month: 0.022332552213940825
      maximum_drawdown: 0.13757363006530082
      worst_symbol_loo_average_month: 0.01955644626929137
      recent_bootstrap_q05_median_q95: [0.0062526, 0.0285406, 0.0512657]
      recent_bootstrap_probability_positive: 0.98365
      recent_bootstrap_probability_at_least_10pct: 0.0
    lower_concentration:
      recent_15m_average_month: 0.028235375129443654
      maximum_drawdown: 0.14326001101707198
      worst_symbol_loo_average_month: 0.01741022881839203
      recent_bootstrap_q05_median_q95: [0.0120899, 0.0288092, 0.0424990]
      recent_bootstrap_probability_positive: 0.9978
      recent_bootstrap_probability_at_least_10pct: 0.0
  leave_one_out_resimulations: 414
  bootstrap_replications_per_profile_and_window: 20000
  diagnosis: >-
    The earnings-event premium is not a one-symbol or one-event illusion:
    every worst-removal result remains positive. However, all three
    development-selected profiles have zero of 20,000 recent block-bootstrap
    samples at the 10% average-month reference. Their 95th percentiles are
    only 4.25%-5.14%, and rolling three/six-month windows include losses.
    The return ceiling under gross<=1 is economically incompatible with Type A.
  quote_replay: >-
    Inapplicable at the stopping gate. Ten-to-twenty-bp bar costs and 10:00-
    10:05 latency already leave the best credible return near 3%; marketable
    quote replay can only reduce or validate execution, not bridge the missing
    7%-12% monthly alpha. Per governance, a bar-stage profile loser is not
    quote-replayed to rescue it.
  artifacts: "artifacts/RUN-0005/"
decision: >-
  Retire CAM-0007 as a genuine modest event-premium finding but not a Type-A
  candidate. Preserve the high-volatility negative-gap reclaim and after-close
  positive-continuation lessons. Keep the sealed holdout untouched and begin a
  materially different mechanism.
