    failure
  new_causal_features:
    first30_close_location: "(09:59 close - 09:30-09:59 low) / first30 range"
    participation: "first30 dollar volume / shifted prior20 median daily dollar volume"
    reaction_gap_ratio: "first30_return / absolute gap"
    stock_vol20: "annualized standard deviation of split close returns through prior session"
    stock_vol_state: "stock_vol20 versus its shifted prior60-session median"
    qqq_prior20_return: "QQQ prior close / QQQ close 21 sessions earlier - 1"
    qqq_vol_state: "QQQ prior20 volatility versus shifted prior60-session median"
  screen_ids:
    - base_gap2
    - gap1
    - gap1_5
    - gap3
