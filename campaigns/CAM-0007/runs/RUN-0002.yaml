  diagnosis: >-
    High pre-event stock volatility is the only tested state that materially
    and chronologically improves the slower negative-gap reclaim leg; all four
    chronological blocks are positive, but 47 trades, three inactive recent
    months, and 41% top-five positive contribution require adversarial
    concentration checks. After-close timing improves positive continuation
    smoothly across three/five/ten-session neighbors and costs, but its first
    block is negative. Neither sleeve approaches Type-A return.
