campaign_id: CAM-0007
run_id: RUN-0002
parent_run: RUN-0001
status: completed
frozen_at: "2026-07-29T05:07:00-07:00"
role: "Weakness-driven causal-state and neighbor diagnostic"

observed_parent_weakness: >-
  RUN-0001's best representative 10 bp variant averaged only 0.864% per
  month. Positive-gap continuation localized at five sessions with low
  drawdown, while negative-gap failure localized more weakly at ten sessions.
  The combined book imported severe early losses, and protected shorts failed.
question: >-
  Is the weak aggregate long alpha diluted by causally identifiable event
  strength, opening participation, announcement timing, or pre-event
  stock/market state, and is it robust to broad gap, horizon, cost, and sizing
  neighbors?
reason: >-
  Earnings information diffusion should be strongest when the news reprices
  the stock materially, the first completed reaction closes firmly in its
  direction on meaningful participation, and the state supports rather than
  mechanically overwhelms the move. Each proposed field is observable by
  10:00 and tests a mechanism-specific explanation of RUN-0001.
expected_effect: >-
  Genuine underreaction should strengthen smoothly with moderate gap,
  reaction, participation, or strong-close thresholds and persist across
  neighboring three/five/ten-session exits. A single brittle threshold,
  announcement bucket, recent-only state, or 33% sizing spike would indicate
  selection rather than a Type-A strategy.

