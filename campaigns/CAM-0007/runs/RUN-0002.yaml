  screen_semantics: >-
    Every non-gap-specific screen retains the base absolute-gap >=2% rule.
    gap1, gap1_5, gap3, gap5, and gap8 replace that threshold; combined
    screens use their explicitly named gap threshold.
  legs:
    - long_positive_continuation
    - long_negative_failure
  horizons: [three_close, five_close, ten_close]
  costs_bps_per_side: [5, 10, 20]
  standard_position_cap: 0.20
  position_cap_neighbors_on_base_only: [0.10, 0.33]
  portfolio_accounting: >-
    Same overlap-aware fixed-size, gross<=1.0, capital-base 1.0 additive
    marked-to-market implementation as RUN-0001.
  expected_variant_count:
    screens_standard_cap: 486
    base_position_cap_neighbors: 36
    total: 522

required_outputs:
