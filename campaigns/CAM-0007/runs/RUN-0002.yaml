  - "Net results for every cost with fixed full/18/15/12-month views"
  - "Chronological blocks, monthly consistency, drawdown/recovery, event/day/symbol concentration"
  - "Neighbor topology rather than the single historical maximum"
  - "Separate mechanism diagnosis for the two long legs"

