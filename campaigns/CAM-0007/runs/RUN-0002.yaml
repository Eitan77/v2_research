decision: >-
  Do not promote. Test each sleeve on a finer causal exit and entry-latency
  lattice, apply sizing neighbors to the actual state-filtered sleeves, combine
  the two distinct long sleeves under one overlap-aware gross cap, and perform
  leave-one-symbol/event and chronological stability diagnostics. Do not revive
  protected shorts absent a new causal explanation.
