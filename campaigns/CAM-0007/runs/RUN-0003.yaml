role: "Filtered-sleeve latency, exit, sizing, and combined-book topology"
adaptation_label: "development-selected from RUN-0002; not untouched evidence"

observed_parent_weakness: >-
  The high-volatility negative-gap reclaim sleeve improved all four blocks but
  had only 47 allocated trades, three inactive recent months, and 41.4%
  top-five positive contribution. The after-close positive continuation sleeve
  was broader and lower drawdown but had a negative first block. Both returned
  only roughly 1%-1.5% per month at the standard 20% cap.
question: >-
  Are these two mechanism-consistent sleeves robust to practical entry delay
  and neighboring exits, can causal sizing improve capital use without
  unacceptable concentration/drawdown, and do their distinct event states
  diversify under one actual gross-exposure cap?
reason: >-
  RUN-0002 localized different payoff clocks: slow recovery after negative
  high-volatility gaps and faster drift after positive after-close releases.
  A finer time lattice challenges those interpretations, while the combined
  book tests portfolio construction rather than pretending independent sleeve
  returns can simply be added.
expected_effect: >-
  A genuine event edge should remain positive at 10:01-10:05 entries and show
  a broad exit plateau. Higher position caps may raise return approximately
  proportionally until event overlap binds, but should reveal concentration
  through drawdown and leave-one-out sensitivity. A useful combination should
  improve consistency or return/drawdown without exceeding gross 1.0.

