    two sleeves diversify enough to remove inactive months. Higher caps improve
    return but reduce allocated event coverage and raise concentration/risk.
    The strongest combined run still has a negative first block and reaches
    only 3.16% monthly, so it is not Type A. RUN-0003 did not combine the newly
    discovered h7-h9 positive plateau because combined horizons were frozen at
