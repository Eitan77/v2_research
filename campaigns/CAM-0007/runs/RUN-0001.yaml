  other_diagnostic:
    ten_close_long_negative_failure_10bp_average_month: 0.0057340180914260295
    ten_close_long_negative_failure_months: "11 positive / 4 negative / 0 inactive"
    ten_close_long_negative_failure_maximum_drawdown: 0.10758653125197748
    all_protected_short_legs_10bp_average_month: -0.006338
  factual_interpretation: >-
    The broad event population is ample and distributed, but the frozen source
    contract is far below the Type-A return objective. Positive-gap
    continuation localizes around a five-session exit and survives 20 bp at
    low absolute return. Negative-gap failure is slower and less stable.
    Protected intraday shorts are negative in aggregate. Combining the two
    long mechanisms increases recent return but imports severe early-period
    losses and drawdown, so the recent chart is not sufficient evidence.
  artifacts:
    valid: "artifacts/RUN-0001/"
    invalid_drawdown_attempt: "artifacts/RUN-0001_INVALID_INITIAL_PEAK/"
decision: >-
  Do not promote. Diagnose long positive continuation and long negative
  failure separately using causal gap magnitude, reaction strength, volume,
  announcement bucket, market state, and horizon/position-cap neighbors.
  Retain protected shorts only as controls unless a principled state explains
  their losses.
