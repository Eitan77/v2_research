role: "Missing exit combination and capacity-allocation stress test"
adaptation_label: "development-selected from RUN-0002 and RUN-0003"

observed_parent_weakness: >-
  RUN-0003's combined grid omitted the newly observed seven-to-nine-session
  plateau of the after-close positive sleeve. Return increased with position
  cap but event coverage fell, and the best p4/n8 book remained only 3.16%
  monthly with a negative first block.
question: >-
  Does combining the two independently observed seven-to-nine-session payoff
  clocks produce a robust improvement, or does any apparent gain require
  extreme single-event concentration or a favorable capacity-allocation
  accident?
reason: >-
  Testing the omitted neighbor lattice is mandatory before stopping. Shared
  equal capacity is compared with a causal strength-priority stress test and a
  half-capital reservation per sleeve so portfolio construction, event alpha,
  and concentration remain separable.
expected_effect: >-
  A robust combined mechanism should form a broad p7-p9/n7-n9 plateau, survive
  10:05 entry and 20 bp/side, and remain useful under sleeve-reserved capital.
  Returns that appear only at cap67-cap100 or strength priority should be
  rejected as concentration-driven.

