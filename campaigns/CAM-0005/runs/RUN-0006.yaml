run_id: RUN-0006
campaign_id: CAM-0005
parent_run_id: RUN-0005
planned_at: "2026-07-29T03:09:00-07:00"
status: completed

change_from_parent: >-
  Freeze q50 and q60 edge25 always-active 15:59-to-next-open candidates and
  acquire targeted SIP quotes and trades only for their union of entry/exit
  events. Replay buys at the first regular SIP ask at/after 15:59 and sells at
  the first regular SIP bid at/after 09:30, with 0/2/5 bp additional slippage.
reason: >-
  Bar evidence is close and strong enough to require execution qualification.
  The strategy crosses both close and open, where spread, auction transition,
  quote availability, and displayed size can differ materially from minute
  opens.
expected_effect: >-
  A real executable candidate should retain positive monthly economics under
  marketable NBBO and 2-5 bp added slippage, have high event coverage, credible
  displayed size, and no dependence on stale or locked/crossed quotes.

configuration:
  candidates: ["q50_edge25", "q60_edge25"]
  event_source: "Frozen RUN-0004 always-active next-open both-reversal at 5 bp"
  quote_windows:
    entry: "15:58:55 through 15:59:10 Eastern"
    exit: "09:29:55 through 09:30:10 Eastern next session"
  replay:
    entry: "First noncrossed SIP ask at or after 15:59:00"
    exit: "First noncrossed SIP bid at or after 09:30:00"
  additional_slippage_bps_per_side: [0, 2, 5]
  data_scope: >-
    SOXL/SOXS only, union of candidate dates and two 15-second windows per
    event; no broad universe or sealed data.
  expected_variant_count: 6

execution_contract:
  pull_command: >-
    python campaigns/CAM-0005/src/pull_run0006_nbbo.py
    --parent-positions campaigns/CAM-0005/artifacts/RUN-0004/positions.parquet
    --output-dir campaigns/CAM-0005/artifacts/RUN-0006/raw
  replay_command: >-
    python campaigns/CAM-0005/src/run0006.py
    --raw-dir campaigns/CAM-0005/artifacts/RUN-0006/raw
    --parent-positions campaigns/CAM-0005/artifacts/RUN-0004/positions.parquet
    --output-dir campaigns/CAM-0005/artifacts/RUN-0006
  expected_variant_count: 6

completed_at: "2026-07-29T03:13:30-07:00"
factual_outcome: >-
  The targeted pull reconciled to 134 unique SOXL/SOXS events and 268
  fifteen-second windows, with 442,764 SIP quote rows, 576,988 SIP trade rows,
  and no request or load on or after 2026-05-01. All 134 events had valid
  noncrossed entry and exit quotes and trades after the frozen timestamps.
  Under first-ask entry and first-bid exit, q60 earned 6.24% average per month
  over 18 months at 2 bp additional slippage per side, 7.89% over 15 months,
  and 5.40% over 12 months, with 19.58% standard drawdown, seven calendar-day
  maximum recovery, 108 trades, and 55.07% top-five-day profit share. At 5 bp
  additional slippage per side it retained 5.84%, 7.51%, and 5.04% average
  monthly return over those windows with 20.70% drawdown. The q50 neighbor
  also remained positive at every replay cost. Median selected spreads were
  4.49 bp at entry and 15.00 bp at exit for q60, already paid by the
  marketable replay. SOXL generated 0.9311 fixed-base return across 57 events
  while SOXS generated 0.2087 across 77; the weaker inverse leg remains the
  main tail risk. Quote size is retained only in raw API units and is not
  converted into a capacity claim.
decision: >-
  Pass execution qualification for the q50/q60 edge25 neighborhood and retain
  q60 as the lower-drawdown primary development candidate. Do not promote it
  as genuine or untouched: all rules were adapted on the same 18-month
  history, the top five days still contribute 55.07% at the central replay,
  and the SOXS leg has a recent large loss. Advance the frozen neighborhood
  to adversarial chronological, concentration, bootstrap, and leave-tail-out
  confirmation before a checkpoint.
next_question: >-
  Does the now-frozen q50/q60 neighborhood survive chronological subperiods,
  moving-block resampling, removal of leading days/months, leg and event
  decomposition, and parameter-neighbor comparison without retrospective
  rescue?
