completed_at: "2026-07-29T02:40:20-07:00"
factual_outcome: >-
  Corrected readiness passed on 133,925 targeted SIP minute rows and 9,990
  official raw/split daily rows, maximum date 2026-04-30 and zero holdout.
  All 96 variants reconciled. The dominant result was SMH late-day reversal:
  q50 product long-only earned +90.90% fixed-base net at 2 bp/side over 187
  decisions, averaging +9.2857% per month over 15 months and +7.3959% over
  12 months. At 5 bp it averaged +8.6337% over 15 months. The unlevered signed
  SMH q50 diagnostic averaged +2.6714% per month with the same sign. However,
  the product drawdown was 61.77%, three recent months were negative, the first
  four campaign months all lost, and top-five days contributed 74.32%.
  SOXL after negative SMH signals contributed +81.64% across 86 trades; SOXS
  after positive signals contributed only +9.26% across 101 trades.
decision: >-
  Preserve SMH overnight reversal as a strong lead, not a candidate. Continue
  within campaign to separate bull/inverse legs, entry/exit auction marking,
  threshold neighbors, chronology, and risk-state causes before any promotion
  or quote pull.
next_question: >-
  Is the edge a robust SOXL dip-buy overnight effect or an opening mark, and
  can causal state/risk controls reduce the unacceptable drawdown without
  destroying the Type-A return profile?
