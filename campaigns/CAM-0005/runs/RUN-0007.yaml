run_id: RUN-0007
campaign_id: CAM-0005
parent_run_id: RUN-0006
planned_at: "2026-07-29T03:18:00-07:00"
status: completed

change_from_parent: >-
  Freeze the execution-qualified q50/q60 neighborhood and audit it without
  changing signals: chronological six-month blocks, calendar years, product
  legs, monthly path, removal of the largest profitable days, leave-one-month
  out sensitivity, and deterministic moving-block bootstrap on the complete
  trading-session return path. Stress marketable NBBO with 2, 5, and 10 bp
  additional slippage per side.
reason: >-
  RUN-0006 passed execution but exposed 55% top-five-day contribution, seven
  negative months, and asymmetric SOXL/SOXS behavior. A genuine recent-regime
  candidate must survive adversarial decomposition and uncertainty analysis
  before any sizing or risk modification is attempted.
expected_effect: >-
  If the edge is distributed, both thresholds should remain positive across
  most chronological blocks and both product legs, leave-top-day returns
  should remain economically useful, and block-bootstrap lower tails should
  not imply that the headline is mainly a fortunate event sequence.

configuration:
  thresholds: ["q50", "q60"]
  additional_slippage_bps_per_side: [2, 5, 10]
  chronological_blocks:
    - ["2024-11-01", "2025-04-30"]
    - ["2025-05-01", "2025-10-31"]
    - ["2025-11-01", "2026-04-30"]
  leave_top_profit_days: [1, 3, 5, 10]
  bootstrap:
    method: "circular moving-block bootstrap"
    seed: 20260729
    replicates: 20000
    trading_session_block_lengths: [20, 60]
    include_zero_return_sessions: true
  sizing: "Unchanged fixed original capital 1.0 per qualifying event"
  expected_variant_count: 6

execution_contract:
  command: >-
    python campaigns/CAM-0005/src/run0007.py
    --replay-path campaigns/CAM-0005/artifacts/RUN-0006/event_replay.parquet
    --calendar-path campaigns/CAM-0005/artifacts/readiness/split_daily.parquet
    --output-dir campaigns/CAM-0005/artifacts/RUN-0007
  expected_variant_count: 6

completed_at: "2026-07-29T03:22:00-07:00"
factual_outcome: >-
  All six frozen variants reconciled. At the central 2 bp additional
  slippage, q60 earned 46.88%, 39.45%, and 25.36% fixed-base net return in the
  three consecutive six-month blocks, so the edge is positive throughout but
  decays in the latest block. SOXL contributed 80.18% and SOXS 31.51% across
  45 and 63 events; both legs are positive, although the inverse leg is much
  weaker. The q60 path has 11 positive and seven negative months, a 1.86%
  median month versus 6.20% mean, and 56.48% winning events. Removing its five
  best days leaves 50.18% total return, but removing the best ten leaves only
  12.60%; at 10 bp extra slippage the corresponding top-ten removal becomes
  negative. Circular 20-session blocks give q60/slip2 a 13.67% fifth-
  percentile total return and 96.97% positive-return frequency, but a 48.87%
  95th-percentile drawdown. Sixty-session blocks give a 22.08% fifth-
  percentile total return, 98.25% positive frequency, and 39.43% 95th-
  percentile drawdown. Q50 is directionally consistent but has higher realized
  and resampled drawdown.
decision: >-
  Retain q60 as an execution-qualified, robustly positive development
  candidate, but do not call it a genuine Type-A candidate. It misses the
  approximate 10%-15% average-month objective, has seven negative months, is
  materially top-ten-event dependent, and has high resampled drawdown tails.
  The positive chronology and both-leg evidence justify one principled
  portfolio-construction investigation rather than retirement or chart-seeking
  threshold tuning.
next_question: >-
  Can causal ex-ante risk sizing and asymmetric product-leg allocation improve
  return consistency and drawdown without selecting particular historical
  dates, suppressing the first observed SOXS tail after the fact, or relying
  on more gross exposure than the fixed 1.0 capital base permits?
