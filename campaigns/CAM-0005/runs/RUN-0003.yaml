completed_at: "2026-07-29T02:50:30-07:00"
factual_outcome: >-
  All 360 variants reconciled with maximum date 2026-04-30 and zero holdout.
  The effect survived 15:59 entry and exits at the next open, 09:30 close, and
  09:34 close, so it is not an opening-auction-only mark. Best q50 both-leg
  reversal at 15:59 to 09:30 close and 2 bp/side averaged 9.7983% per month
  over 15 months and 8.1394% over 12 months, but drawdown was 64.93%.
  Q40-Q60 and 2-10 bp neighbors were positive. Unlevered q50 signed SMH
  reversal averaged 2.9059% per month. The q50 SOXL negative-signal leg
  averaged 7.5197% per month at 2 bp with 33.75% drawdown; its late half was
  strongly positive but early half was near zero. SOXS positive-signal
  reversal decayed to negative over the latest 12 months. Always-SOXL was
  weaker over 15 months and lost in the early half.
decision: >-
  Preserve the family as a strong adapted lead but not a candidate. Continue
  with causal close-location pressure confirmation and shifted trailing
  unlevered-edge activation to address drawdown/regime decay. Do not yet use
  quote data.
next_question: >-
  Can prespecified pressure confirmation and rolling unlevered reversal
  activation preserve roughly 10% monthly return while cutting drawdown and
  concentration to a credible range across neighboring settings?
