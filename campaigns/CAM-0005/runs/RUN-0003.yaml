change_from_parent: >-
  Restrict diagnosis to the strong SMH family; separate SOXL dip buys, SOXS
  rally fades, both-leg reversal, and an always-SOXL control across causal
  magnitude neighbors, entry latency, and opening exit marks. Mirror the
  decomposition on unlevered SMH, retaining positive-signal short exposure as
  diagnostic only.
reason: >-
  RUN-0002 is close to the Type-A return profile but has unacceptable drawdown,
  contribution concentration, late-sample strengthening, and asymmetric
  product legs. The next run must identify whether the edge is genuine
  overnight mean reversion, generic SOXL overnight drift, or a 09:30 mark.
expected_effect: >-
  A genuine SMH dip-reversal mechanism should favor the negative-signal SOXL
  leg over always-SOXL, persist at 15:59 entry, remain visible through 09:35,
  match long SMH after negative signals, and form a q40-q67 neighborhood.

