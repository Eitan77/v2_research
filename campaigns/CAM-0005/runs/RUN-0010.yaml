change_from_parent: >-
  Backcast the now-frozen q60/edge25 base and high-volume state, plus q50 and
  q67 magnitude neighbors, through March 2023-October 2024 using the same
  causal shifted thresholds, 15:59 bar-open entry, 09:34-complete exit, long
  SOXL/SOXS expression, and 5/10 bp per-side bar costs. Compare the older
  context with the declared November 2024-April 2026 recent regime.
reason: >-
  Strategy A may be a temporary recent phenomenon, but older history remains
  mandatory context for mechanism, tails, and causal onset/decay logic. The
  older interval was not used to select the q60/high-volume state and is
  diagnostic backcast evidence, not untouched forward confirmation.
expected_effect: >-
  Supportive older behavior would strengthen mechanism durability; weak older
  behavior would require an honest recent-regime label and causal activation
  rule. Severe adverse tails or sign reversal would weaken or retire the
  development sleeve even if recent results remain positive.

