completed_at: "2026-07-29T03:48:00-07:00"
factual_outcome: >-
  All eight bar-context variants reconciled with zero holdout. The q60/edge25
  base was positive but weak before the recent window: at 5 bp it averaged
  2.53% per month over March 2023-October 2024, with eight negative months,
  46.43% drawdown, 188-day recovery, +54.70% from SOXL and -4.14% from SOXS.
  In the recent bar window it averaged 6.58%, with five negative months and
  17.24% drawdown. The frozen high-volume state averaged 1.62% in older
  history, with seven negative and two zero months, 36.24% drawdown, an
  unresolved ending drawdown, +54.14% SOXL and -21.76% SOXS. Its recent bar
  view improved to 5.79% average month, three negative and two zero months,
  6.08% drawdown, five-day recovery, and positive contributions from both
  product legs. Q50/q67 neighbors show the same older weakness; q67 was
  approximately flat at 10 bp in older history.
decision: >-
  Treat the q60/high-volume sleeve strictly as a recent-regime development
  result. Older history supports the sign of the bull-leg mechanism but reveals
  severe historical drawdown, slow or unresolved recovery, and adverse inverse
  contribution. It cannot be promoted as durable or genuine Type A. The prior
  causal activation experiments could not identify the onset before outcomes,
  so no retroactive regime start is accepted.
next_question: >-
  Within the fixed 1.0 gross-exposure cap, do causal volume-tier,
  signal-strength, or asymmetric inverse-leg allocations offer a superior
  return-consistency-drawdown tradeoff, or do they only reduce an already
  below-target return?
