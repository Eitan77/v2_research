completed_at: "2026-07-29T02:58:30-07:00"
factual_outcome: >-
  All 576 variants reconciled with zero holdout rows. Close-location pressure
  confirmation materially improved risk. Q60/edge25 both-leg reversal at
  15:59-to-next-open and 5 bp/side averaged 8.4482% per month over 15 months
  with 18.45% drawdown, four negative months, 108 trades, and 51.69% top-five
  day contribution. Q50/edge25 averaged 8.5434% with 22.83% drawdown. Edge20,
  edge25, and edge33 formed a positive neighborhood and 10 bp costs survived.
  Aggregate 10/20/40-session activation reduced drawdown to roughly 12%-16%
  but return fell to 4.9%-6.6%. The q60/edge25 latest-12-month average was
  5.93%, including -17.11% in April 2026. April decomposed to -26.68% across
  eight SOXS positions while two SOXL positions gained +9.57%.
decision: >-
  Preserve pressure-confirmed reversal as candidate-shaped but not confirmed.
  Test leg-specific causal suspension because the inverse leg decays while the
  bull leg remains healthy; aggregate activation is structurally unable to
  distinguish them. No quote replay yet.
next_question: >-
  Can shifted trailing unlevered positive- and negative-signal reversal means
  suspend the decayed SOXS leg while retaining the healthy SOXL leg across
  10/20/40-event and pressure/threshold neighbors?
