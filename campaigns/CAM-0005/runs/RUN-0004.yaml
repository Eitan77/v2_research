run_id: RUN-0004
campaign_id: CAM-0005
parent_run_id: RUN-0003
planned_at: "2026-07-29T02:54:00-07:00"
status: completed

change_from_parent: >-
  Add symmetric close-location pressure confirmation and causal trailing
  unlevered-reversal activation to q40/q50/q60 product legs, retaining frozen
  15:59 entry, next-open/09:34 exits, and 5/10 bp costs.
reason: >-
  RUN-0003 establishes a real but high-drawdown mechanism. Diagnostic
  decomposition shows returns are strongest when the completed final-hour
  close remains near the directionally pressured range edge. A rolling
  unlevered SMH reversal mean provides a causal suspension rule for regime
  decay without using leveraged-product profit to label its own state.
expected_effect: >-
  Pressure confirmation should remove weak/incomplete imbalances; trailing
  activation should avoid extended sign inversions. A credible candidate
  region must preserve return across cutoff/window neighbors while materially
  reducing drawdown, negative months, and top-day dependence.

configuration:
  thresholds: ["q40", "q50", "q60"]
  pressure_states:
    all: "No close-location filter"
    edge20: "negative close-location <=0.20 or positive >=0.80"
    edge25: "negative close-location <=0.25 or positive >=0.75"
    edge33: "negative close-location <=0.33 or positive >=0.67"
  activation_states:
    always: "No rolling activation"
    edge10: "Prior 10-session mean unlevered signed SMH reversal > 0"
    edge20: "Prior 20-session mean unlevered signed SMH reversal > 0"
    edge40: "Prior 40-session mean unlevered signed SMH reversal > 0"
  activation_timing: "Rolling mean shifted one full session"
  product_legs:
    ["both_reversal", "negative_signal_bull", "positive_signal_inverse"]
  entry: "15:59 open"
  exits: ["next_open", "next_0934_close"]
  cost_bps_per_side: [5, 10]
  expected_variant_count: 576

