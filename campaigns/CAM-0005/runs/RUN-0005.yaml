run_id: RUN-0005
campaign_id: CAM-0005
parent_run_id: RUN-0004
planned_at: "2026-07-29T03:02:00-07:00"
status: completed

change_from_parent: >-
  Replace aggregate activation with separate shifted trailing unlevered SMH
  reversal means for negative-signal long and positive-signal short-diagnostic
  events. Apply the corresponding state to SOXL or SOXS independently.
reason: >-
  April 2026 losses are entirely the SOXS leg while SOXL remains profitable.
  Aggregate activation masks this divergence. Leg-specific unlevered
  activation is causal, mechanism-consistent, and avoids selecting on
  leveraged-product P&L.
expected_effect: >-
  A valid decay rule should suspend SOXS after its unlevered positive-signal
  reversal turns negative, retain SOXL while its negative-signal rebound
  remains positive, improve the latest 12 months and April tail, and remain
  stable across 10/20/40 prior same-leg event windows.

