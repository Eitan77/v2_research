completed_at: "2026-07-29T03:05:30-07:00"
factual_outcome: >-
  All 96 variants reconciled with zero holdout. Leg-specific 10/20/40-event
  activation did not improve the always-active pressure-confirmed family.
  The best adapted activation was q50/edge25/event40 at 5 bp/side: 5.80%
  average month over 15 months, 3.62% over 12 months, and 16.93% drawdown.
  Event10 lowered drawdown to 14.39% but averaged only 5.38% per month. The
  first large SOXS loss can occur while the prior leg mean remains positive,
  so causal trailing means cannot prevent the tail without materially reducing
  opportunity and return.
decision: >-
  Reject trailing activation as a rescue and retain the simpler always-active
  q50/q60 edge25 neighborhood for execution qualification. Do not select a
  rolling window. Pull targeted SIP quotes/trades only for the union of frozen
  q50/q60 edge25 events.
next_question: >-
  Do marketable SIP NBBO entry/exit prices, observed trades, displayed size,
  and conservative slippage preserve the candidate-shaped economics?
