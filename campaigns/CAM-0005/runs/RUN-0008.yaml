change_from_parent: >-
  Keep the frozen q50/q60 edge25 signals and 15:59 marketable entries, but
  replace the first 09:30 bid with the first noncrossed SIP bid at or after
  09:35, after the 09:34 minute is complete. Pull only the missing SOXL/SOXS
  exit quote and trade windows for the same 134 events and compare 2, 5, and
  10 bp additional slippage per side.
reason: >-
  The 09:30 replay pays a 15 bp median exit spread. The prespecified bar-stage
  09:34-complete exit had fewer negative months and lower drawdown with only a
  small full-return reduction. A five-minute delay may exchange auction
  transition noise for tighter executable spreads without changing the
  overnight absorption mechanism.
expected_effect: >-
  If auction transition is the main execution drag, the 09:35 marketable exit
  should materially tighten spreads, preserve most net return, and improve
  monthly consistency or drawdown. If returns vanish, the apparent bar-stage
  benefit was not executable.

