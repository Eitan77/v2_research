completed_at: "2026-07-29T03:31:00-07:00"
factual_outcome: >-
  The targeted pull reconciled to the same 134 frozen events, 329,045 SIP
  quotes, 95,638 trades, and zero holdout requests. Every event had a valid
  post-09:35 quote and trade. For q60 with 2 bp additional slippage per side,
  median exit spread fell from 15.00 bp at 09:30 to 4.88 bp at 09:35, standard
  drawdown fell from 19.58% to 17.40%, and negative months fell from seven to
  five over 18 months. Net average month was 6.37% over 18 months, 7.34% over
  15 months, and 4.18% over 12 months. Top-five-day contribution improved to
  50.19%. The final drawdown remained unresolved at the discovery boundary.
  Q50 was weaker. All q50/q60 variants remained positive through 10 bp extra
  slippage per side.
decision: >-
  Prefer the 09:35 exit for lower spread, drawdown, and concentration, but do
  not promote q60. It remains an execution-qualified development candidate
  below the Type-A return and consistency objectives, with recent decay and an
  unresolved ending drawdown. Continue only through the still-unanswered
  causal state and portfolio-construction questions declared in the campaign;
  do not add leverage.
next_question: >-
  Do prespecified causal volume, volatility, signal-strength, and market-state
  observables identify a stable higher-expectancy subset across chronological
  blocks, or do they merely reduce sample size and overfit the same leading
  events?
