robustness:
  chronology: >-
    Unit q60 at 5 bp earned 62.31%, 33.56%, and 12.25% in three consecutive
    six-month blocks; the combined lower-drawdown allocation earned 34.49%,
    21.15%, and 35.07%.
  concentration: >-
    Unit q60 loses about 88.7% of total profit after removing its ten best
    days. The combined allocation improves top-five share to 47.96% but does
    not eliminate event concentration.
  block_bootstrap: >-
    For unit q60 with 2 bp extra slippage, circular 20-session and 60-session
    bootstrap positive-return frequencies were 96.97% and 98.25%. Their
    95th-percentile maximum drawdowns were 48.87% and 39.43%.
  older_context: >-
    March 2023-October 2024 q60/high-volume bar context averaged 1.62% per
    month at 5 bp, with 36.24% drawdown, unresolved recovery, and a losing
    SOXS leg. The recent result is regime-specific rather than durable.

activation_and_decay:
  causal_event_activation: >-
    q60 magnitude, direction-consistent edge25 close location, and optional
    dollar volume above its shifted prior-60-session median are available at
    the decision time.
  regime_activation: >-
    No separate causal regime-onset rule was validated. Trailing unlevered
    10/20/40-event activation reduced return and failed to preempt the first
    inverse tail, so the favorable recent start cannot be claimed prospectively.
  forward_monitor: >-
    Paper only. Monitor rolling 20 qualifying-event net expectancy, underlying
    signed SMH expectancy, SOXL/SOXS separately, monthly path, marketable
    spread coverage, and top-day share. Suspend rather than retune when either
    the underlying relationship or a product leg becomes nonpositive over a
    completed monitoring window; retirement thresholds require prospective
    evidence and must be frozen before use.

