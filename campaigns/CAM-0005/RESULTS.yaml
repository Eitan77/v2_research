mechanism_evidence:
  direction: >-
    Completed late-SMH pressure reverses overnight: negative late SMH selects
    long SOXL and positive late SMH selects long SOXS. The matching signed
    unlevered SMH relationship was positive, so leveraged products amplify a
    real underlying effect rather than create it.
  breadth: >-
    QQQ did not provide comparable candidate economics. SOXL contributed most
    profit, while SOXS was positive in the recent frozen replay but weaker and
    historically adverse.
  timing: >-
    The edge survived 15:56 and 15:59 entries and next-open, 09:30-complete,
    and 09:34-complete exits. The preferred executable exit is first valid bid
    after 09:35 because it avoids the wider opening-transition spread.
  state: >-
    Edge25 close-location pressure and q50/q60 magnitude form a stable region.
    High final-hour dollar volume relative to a shifted prior-60-session median
    materially reduces drawdown. Volatility, trend, stronger magnitude, and
    combined states did not improve Type-A economics.

