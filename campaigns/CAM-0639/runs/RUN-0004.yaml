question: Can information known by MU's close distinguish green from red next overnights out of sample?
reason: The unconditional strategy is profitable but unstable; causal conditioning may separate favorable overnight states.
expected_effect: A real relationship should improve green rate and 2bp-side return in expanding tests without relying on one year or tail event.
configuration:
  features:
    - MU day return, first-30m and last-30m returns, range, close location, volume ratio
    - MU prior overnight, trailing 5/20-session returns
    - same-day QQQ, SMH, and SPY returns plus MU-minus-SMH return
    - day-of-week encoding
  expanding_tests: [2023, 2024, 2025, 2026_through_april]
  models: [fixed_simple_rules, l2_logistic_green_probability, ridge_return_rank]
  selection: model score above training-period 75th percentile
  cost_bp_per_side: 2
  minimum_history: 2021-05-03 through 2022-12-31 before first test
