run_id: RUN-0005
campaign_id: CAM-0006
parent_run_id: RUN-0004
planned_at: "2026-07-29T03:57:00-07:00"
status: completed

change_from_parent: >-
  Freeze the 10% gap-tail top-reclaim all-state and volatility-high branches.
  Pull targeted Alpaca SIP quotes and trades only for their union of exact
  event windows. Replay entry at the first valid noncrossed ask at or after
  09:31:00 Eastern and exit at the first valid noncrossed bid at or after the
  calendar-aware final-exit minute (15:54 normally, 12:54 on early closes),
  with 0/2/5 bp additional slippage per side.
reason: >-
  RUN-0004 produced two close/strong development sleeves whose bar economics
  warrant execution evidence even though neither is Type A. Both trade
  marketably near the open and close, and minute-open assumptions can conceal
  spread, delay, displayed-size, or auction-transition costs.
expected_effect: >-
  A credible sleeve should have near-complete post-signal quote/trade coverage,
  reasonable noncrossed spreads and delays, distributed contribution, and
  positive economics after ask-to-bid crossing plus 2-5 bp additional
  slippage. Quote replay cannot upgrade a sub-Type-A return profile by itself.

configuration:
  candidates:
    - "tail10_anomaly1 top1_reclaim all_state"
    - "tail10_anomaly1 top1_reclaim qqq_vol_high"
  source_events: "RUN-0004 c10 allocated positions; union only"
  quote_windows:
    entry: "09:30:55 through 09:31:10 Eastern"
    exit: "final-exit target minus 5 seconds through plus 10 seconds"
  replay:
    entry: "First noncrossed positive SIP ask at or after target"
    exit: "First noncrossed positive SIP bid at or after target"
  additional_slippage_bps_per_side: [0, 2, 5]
  data_scope: >-
    Exact selected symbols, dates, and two 15-second windows per union event;
    no broad universe and no request on or after 2026-05-01.
  size_warning: >-
    Preserve Alpaca quote-size fields in raw API units and make no capacity
    claim without a separately verified unit and depth contract.
  expected_variant_count: 6

execution_contract:
  pull_command: >-
    python campaigns/CAM-0006/src/pull_run0005_nbbo.py
    --parent-positions campaigns/CAM-0006/artifacts/RUN-0004/positions.parquet
    --signals-path campaigns/CAM-0006/artifacts/RUN-0002/enriched_signals.parquet
    --output-dir campaigns/CAM-0006/artifacts/RUN-0005/raw
  replay_command: >-
    python campaigns/CAM-0006/src/run0005.py
    --raw-dir campaigns/CAM-0006/artifacts/RUN-0005/raw
    --output-dir campaigns/CAM-0006/artifacts/RUN-0005
  expected_variant_count: 6

execution_notes:
  first_pull_attempt: >-
    Alpaca returned JSON null rather than an empty list for at least one
    no-record window. The parser stopped before writing raw data or producing
    results. Its stderr log is preserved; the parser now treats null as zero
    records and the identical frozen request set is rerun.

completed_at: "2026-07-29T04:07:05-07:00"
factual_outcome: >-
  The targeted pull requested 232 frozen union events and 464 fifteen-second
  windows, returned 110,006 SIP quotes and 132,567 SIP trades, ended
  2026-04-29, and requested/loaded zero holdout rows. Valid post-target
  noncrossed quotes covered 220/232 all-state events and 116/122 volatility-
  high events; trade evidence was complete for 230/232 union events. The
  missing quotes were concentrated in 11 entry windows and one exit window.
  First-ask/first-bid replay had median entry spread 27.96 bp all-state and
  29.54 bp volatility-high, versus about 3.0-3.3 bp at exit; median quote
  delays were about 0.41 seconds entry and 0.04-0.05 seconds exit. Marketable
  NBBO plus 2 bp additional slippage per side produced 5.96% average month
  over 15 months for all-state with 25.93% drawdown and 5.17% for volatility-
  high with 8.87% drawdown. At 5 bp additional slippage those figures were
  5.23%/29.48% and 4.79%/10.95%. The volatility-high branch retained only one
  negative active month at zero/5 bp views but three inactive months. Quote
  size remains in unverified raw API units, so no capacity claim is made.
decision: >-
  Execution is economically plausible for covered events but cannot promote
  either sleeve to Type A; open-entry spreads consume meaningful alpha and
  the return objective remains well short. Resolve the 12 missing quote events
  with a separately frozen, targeted longer-window sensitivity. Treat delayed
  first quotes as actual delayed fills, not as evidence supporting 09:31
  capacity. Then finish adversarial campaign review and close or freeze the
  mechanism.
next_question: >-
  How long after the target do valid quotes first appear for the 12 incomplete
  events, and do inclusion at those actual delayed fills materially change
  sleeve economics or reveal an execution eligibility rule?
