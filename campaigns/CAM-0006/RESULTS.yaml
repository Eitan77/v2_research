  Not a genuine Type-A candidate. Official opening-auction gap absorption has
  a causal, marketable, and robustly positive long-stock sleeve in high prior
  QQQ volatility, but its approximately 5.5% average month is near half the
  reference objective. It has three inactive months, meaningful contributor
  dependence, adaptation on the same discovery sample, no capacity evidence,
  and no sealed-holdout or prospective confirmation.

