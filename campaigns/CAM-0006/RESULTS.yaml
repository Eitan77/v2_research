mechanism_evidence:
  sign: >-
    Broad opening continuation, protected shorts, and balanced books failed
    after costs. The coherent direction is long stocks after an unusually
    negative official opening gap whose completed first minute reclaims at
    least 25% of the gap.
  auction_information: >-
    Auction-dollar anomaly and same-day participation strengthen the long
    absorption branch beyond gap magnitude alone. A shifted anomaly >=1 and
    first-minute dollar-participation above the same-day median form useful
    causal states.
  timing: >-
    Immediate 09:31 entry and same-session final exit dominate 09:32-09:35
    delays and 09:45/10:00/12:00 exits. One-to-three-percent stops and
    auction-price failure exits harm both return and drawdown because
    profitable paths often recross the auction before recovering.
  market_state: >-
    Prior QQQ 20-day volatility above its shifted prior-60-state median
    materially reduces drawdown. QQQ trend and signal breadth do not create
    comparable economics.
  portfolio: >-
    Selecting the strongest reclaim event among simultaneous causal signals
    improves return versus equal weighting. Full-sample ticker selection is
    never used.

