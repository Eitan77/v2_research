completed_at: "2026-07-28T22:56:00-07:00"
factual_outcome: >-
  All 486 reclaim-neighborhood cells executed with data through 2026-04-30
  and zero holdout rows. No cell reached even 2% average monthly return. The
  maximum representative average was 1.50% per month: 15-minute formation,
  6% residual decline, 10x surprise, reclaim2, 60-minute hold, no volume
  filter. It earned 20.20% total with 2.33% drawdown but only 13 events,
  eight zero months in the representative window, and seven zero months in
  the recent 12 months. The 6x/8x neighbors produced similar 1.24%-1.43%
  recent averages. Lower 2%-4% thresholds increased samples into the hundreds
  but diluted the edge; their best recent-window averages were below 0.7% and
  several turned negative. Zero of 486 cells approached the 10%-15% Strategy
  A objective.
decision: >-
  Reject higher opportunity frequency as a rescue: common residual shocks do
  not retain the stabilized edge, while extreme shocks are structurally too
  rare under fixed-capital, unlevered accounting. Complete a frozen TP/SL and
  adverse intrabar-ordering audit of the extreme stabilized family to test
  risk/exit shape, then perform the campaign conclusion audit.
next_question: >-
  Can realistic stops or take-profits improve the extreme stabilized family's
  return path without relying on rarity, and does any principled CAM-0002
  question remain afterward?
