run_id: RUN-0009
campaign_id: CAM-0002
parent_run_id: RUN-0008
planned_at: "2026-07-28T22:51:00-07:00"
status: completed

change_from_parent: >-
  Expand the causal reclaim test to more frequent 10/15/30-minute SPY-residual
  shocks across broad 2%/4%/6% and 6x/8x/10x neighborhoods.
reason: >-
  RUN-0008 showed that a completed-bar reclaim improves the extreme
  residual-stock anchor, but only 18 portfolio events cap income. Testing
  neighboring less-extreme shocks is the principled way to increase frequency;
  leverage or retrospective ticker selection is not.
expected_effect: >-
  If stabilization converts common overreactions into an edge, positive net
  results should span adjacent formation, residual-severity, surprise, volume,
  confirmation, and hold cells with materially higher event counts and a
  complete recent monthly path.

configuration:
  formation_minutes: [10, 15, 30]
  residual_decline_thresholds: [0.02, 0.04, 0.06]
  stock_surprise_thresholds: [6, 8, 10]
  causal_volume_ratio_thresholds: [0, 2, 5]
  confirmations: ["reclaim2", "no_new_low5"]
  holding_minutes: [15, 30, 60]
