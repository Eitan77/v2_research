completed_at: "2026-07-28T22:13:00-07:00"
factual_outcome: >-
  The 301 unclustered events had a small +0.220% mean 30-minute gross rebound,
  only +0.020% after a 10-bps-per-side screen, and a negative -0.209% mean
  60-minute gross return. The source prediction was not monotonic: >=8% shocks
  lost 0.565% gross at 30 minutes, while 6%-8% shocks gained 0.418%. Apparent
  strength in clusters larger than ten was almost entirely the April 7, 2025
  market-wide tariff episode (four consecutive minute clusters containing
  12-25 symbols). Solo events lost 0.090% gross at 30 minutes. Top ten events
  supplied 30.7% of positive gross P&L.
decision: >-
  Do not select the large-cluster or April 7 subset; it is episode-concentrated
  and not a general causal edge. Expand the prespecified source threshold and
  exit neighborhoods, including shorter exits, to determine whether the recent
  reversal occurs earlier or under less extreme but more repeatable shocks.
next_question: >-
  Does any broad source-neighbor combination show net fixed-capital profit
  across months after excluding dependence on the April 7 market episode?
