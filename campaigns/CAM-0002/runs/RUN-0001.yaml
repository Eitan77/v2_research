completed_at: "2026-07-28T22:10:56.3125558-07:00"
factual_outcome: >-
  The recent source-faithful long component failed economically. At 60 minutes
  and 10 bps/side it lost 21.61% across 135 independent clusters, with 46.7%
  positive events, 33.17% drawdown, and unresolved 520-day recovery. The 15m
  average month was -1.05%; 11/15 months were negative. Thirty-minute holding
  was worse at -47.48%. Higher costs deteriorated monotonically. Gross 60-minute
  rebound before 10-bps round-trip costs was only about +5.4%, so weak gross
  alpha rather than bar-fill optimism is the first diagnosed problem.
decision: >-
  Do not retire from one baseline. Separate gross-alpha cases by shock size,
  duration, time of day, symbol, market clustering, and causal volatility/
  liquidity state; then test the source threshold and horizon neighborhoods.
next_question: >-
  Is the weak aggregate hiding a causally identifiable subset or a different
  shock duration/exit horizon consistent with temporary liquidity pressure?
