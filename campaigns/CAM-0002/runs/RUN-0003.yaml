completed_at: "2026-07-28T22:15:00-07:00"
factual_outcome: >-
  Fifteen of sixteen source-neighbor variants lost money at 10 bps/side.
  The sole positive result (4% absolute, 10x relative, 60m) earned only 2.01%
  total over 18 months, averaged 0.29% per month over 15 months, had nine
  negative months over 18 months, 40 events, and 221-day recovery. It remained
  small after excluding April 7 (+3.45% total). Larger absolute shocks and the
  30-minute exit were consistently negative; no A-type neighborhood exists.
decision: >-
  Reject threshold tightening as a viable rescue. Inspect the post-event path
  at 5-60 minutes and realistic 1/2/5-minute entry delays to determine whether
  reversal is faster than the source's 30-minute measurement.
next_question: >-
  Is there a short-lived executable rebound immediately after event completion,
  or does the recent sample continue falling before any recovery?
