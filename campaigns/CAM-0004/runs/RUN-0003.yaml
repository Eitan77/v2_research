completed_at: "2026-07-29T01:35:32-07:00"
factual_outcome: >-
  Validation passed with maximum loaded date 2026-04-30 and zero holdout rows.
  The executed contract reconciled to 60 variants: two signal models, two tail
  breadths, five holding horizons, and three execution definitions. All 60
  gross variants lost. The least-negative result was residual quintile K1/M1
  source-close at -9.0638% fixed-base simple P&L over 18 months, -0.2058 bps
  per decision, -0.1638% average month over the representative 15-month view,
  10 of 15 negative months, and 16.50% maximum drawdown. Its actionable
  open-to-close version lost 11.5957%. No model, breadth, horizon, or execution
  definition had positive gross P&L or a positive break-even cost budget.
  Residual source-close period means were negative through most of the morning
  and locally positive around 12:00, 13:30-14:00, and 15:30, but those clock
  subsets were observed after the run and are not candidate evidence.
decision: >-
  Reject execution-gap, one-period-only, and decile-only explanations for
  RUN-0002. Do not promote or quote replay any variant. Continue with the
  paper-prespecified cumulative formation/holding grid and causal
  liquidity-stress conditioning before judging the adapted mechanism.
next_question: >-
  Can cumulative K-period residual displacement or a prespecified causal
  high-noise/liquidity-stress state recover a positive, chronologically stable
  gross reversal spread without selecting clock periods from this result?
