change_from_parent: >-
  Decompose the losing one-period bar result into source close-to-close alpha,
  following-open alpha, and emergency-stop effects while testing paper-supported
  1/2/3/4/6-period holdings and decile versus quintile breadth.
reason: >-
  Both baseline legs lost, but RUN-0002 combined signal failure, a following
  open, a one-period horizon, narrow tails, and an emergency stop. The next run
  must identify which layer fails before modifying the mechanism or retiring it.
expected_effect: >-
  If residual liquidity provision exists but execution or horizon obscures it,
  source close-to-close residual spreads should be positive, exceed raw-return
  controls, persist for multiple periods, and imply a positive cost budget. If
  all gross definitions remain negative, the recent mechanism lacks support.

