change_from_parent: >-
  Acquire cutoff-bounded raw SIP minute bars from Alpaca and reproduce the
  source-positive continuation family on EEM, FXI, EFA, VWO, and IYR.
reason: >-
  The primary paper specifically reports ETF pervasiveness and unusually large
  effects for emerging-market and real-estate ETFs. Those instruments were
  absent from the local raw-bar inventory, so concluding from RUN-0003 would
  leave a source-identified universe omission.
expected_effect: >-
  If closing-flow continuation remains economically alive where the source
  found it strongest, positive-morning cells should be profitable across
  neighboring intervals and not depend on a single hindsight-selected ETF or
  state.

