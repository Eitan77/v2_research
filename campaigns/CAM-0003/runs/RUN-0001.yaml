completed_at: "2026-07-28T23:19:00-07:00"
factual_outcome: >-
  All six frozen variants executed on 373 sessions with zero field attrition,
  data through 2026-04-30, and zero holdout rows. The positive-morning source
  component failed: at 2 bps per side it lost 9.21% over 18 months, averaged
  -0.39% per month over the representative 15 months and -0.56% over 12
  months, had 14 negative months over 18 months, 9.40% drawdown, and an
  unresolved ending recovery. The gross predictive slope was -0.0187 and
  correlation -0.059; mean gross closing-half-hour return was -0.0043% after
  positive mornings versus +0.0208% after nonpositive mornings. Always-long
  closing exposure also lost after costs. Four semantic tests passed.
decision: >-
  The recent source sign is inverted, but a first failure does not retire the
  mechanism. Separate overnight and opening-session information, test
  15/30/60-minute morning and closing intervals, and add the source's r12
  pre-close confirmation before judging whether the effect decayed or migrated.
next_question: >-
  Is modern closing continuation predicted by a different morning component,
  interval, or same-sign pre-close confirmation?
