  A genuine closing-flow mechanism should appear across neighboring intervals
  in one or more unleveraged equity ETFs and strengthen monotonically in
  causal high-volume or high-volatility states. Leveraged products are
  diagnostic magnitude checks only if unleveraged alpha survives.

