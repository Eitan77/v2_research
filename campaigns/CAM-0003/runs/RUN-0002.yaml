completed_at: "2026-07-28T23:25:00-07:00"
factual_outcome: >-
  All 54 interval/component/confirmation cells executed with zero feature
  attrition and zero holdout rows. Every cell lost at 2 bps per side. The
  least-bad representative result (15-minute open-session signal, 30-minute
  close hold, positive same-length pre-close confirmation) still averaged
  -0.063% per month over 15 months and -0.141% over 12 months, with eight of
  15 months negative. Combined previous-close and overnight signals were
  consistently worse. No modern interval migration or r12 rescue appeared.
decision: >-
  Reject SPY interval/component migration as a rescue. Test the source's
  cross-ETF pervasiveness and causal high opening-volume/volatility states,
  which are its strongest mechanism-predicted conditions, before considering
  the core effect unsupported.
next_question: >-
  Does recent intraday momentum survive in another broad/sector ETF or only on
  causally high opening-volume/volatility days?
