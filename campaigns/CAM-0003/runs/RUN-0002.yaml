status: completed

change_from_parent: >-
  Decompose the morning signal into overnight, opening-session, and combined
  returns; compare 15/30/60-minute morning and closing intervals with and
  without same-length positive pre-close confirmation.
reason: >-
  RUN-0001 found an inverted recent source slope. The paper's mechanism may now
  reside in overnight news, the cash-open response, or a shifted boundary
  interval, while its joint r12 signal may filter late-day reversals.
expected_effect: >-
  A surviving information-diffusion effect should be positive across adjacent
  morning/closing intervals and improve under causal same-sign pre-close
  confirmation without collapsing the sample.

configuration:
  instrument: "SPY"
  morning_components: ["combined_previous_close", "overnight_to_open", "open_session"]
  morning_intervals_minutes: [15, 30, 60]
  closing_holds_minutes: [15, 30, 60]
  confirmations: ["none", "positive_preclose_same_length"]
  signal: "long when selected morning component return > 0"
  cost_bps_per_side: 2
  variants: 54
  accounting: "fixed capital 1.0, additive P&L"

execution_contract:
  command: >-
    python campaigns/CAM-0003/src/run0002.py
    --output-dir campaigns/CAM-0003/artifacts/RUN-0002
  expected_variant_count: 54
  output_paths:
