question: >-
  Is RUN-0001's close-only SMH-residual result a stable information-diffusion
  effect across causal sign, clock, attention, shock, peer-lag, breadth, and
  cost neighbors, or a fragile full-sample aggregate?
reason: >-
  The faithful 5-60 minute propagation mechanism failed. Forced-close returns
  were positive, but only 8/15 recent months were positive and simple
  escalation of leader magnitude or attention was contradicted by the
  decomposition. A broad prespecified diagnostic screen is required before
  changing formation construction or abandoning the slower-drift lead.
expected_effect: >-
  A credible information-diffusion effect should remain positive in multiple
  adjacent causal regions, show a coherent lag-state shape, survive modest
  breadth/cost changes, and not depend on one narrow post-open interval.

