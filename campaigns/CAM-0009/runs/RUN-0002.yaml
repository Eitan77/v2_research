    - "Both-sign and long-only regions are materially stronger than short-only; negative-only median recent performance is approximately flat."
    - "All-time and open-hour regions dominate; post-open and mid-morning medians are much weaker, although isolated post-open variants remain positive."
    - "Higher attention and stronger shock filters reduce the median result; the edge does not strengthen monotonically with information intensity."
