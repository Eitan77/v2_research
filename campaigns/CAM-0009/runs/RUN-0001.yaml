question: >-
  Do large, high-attention completed semiconductor leader moves propagate in
  the same direction to causally lagging point-in-time QQQ peers over the next
  five minutes through the session close?
reason: >-
  Minute, daily, adjustment, membership, shifted beta/volume, entry, calendar,
  cutoff, and short-safeguard readiness passed. The source contract must be
  measured before changing thresholds, formations, peer definitions, sizing,
  or hedging.
expected_effect: >-
  Positive leader shocks should produce long peer continuation. Negative
  shocks may produce short peer continuation, subject to full-path 2% stops.
  QQQ/SMH residual controls should distinguish sector information from broad
  tape beta. A real propagation clock should peak at a short finite horizon.

