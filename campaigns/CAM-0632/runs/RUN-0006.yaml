    - top-ten absolute-return share no greater than 0.50
    - positive all chronology blocks and latest twelve months at 1000ms plus 5bp per side
  cutoff: 2026-04-30
expected_effect: A genuine sparse structural reversal should survive without one crisis window or one date. Passing does not make it frequent or monthly consistent; it only earns a frozen adapted candidate and forward paper recommendation.
