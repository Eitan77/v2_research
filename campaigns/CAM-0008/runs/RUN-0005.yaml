decision: >-
  Retire CAM-0008 as a genuine, distributed, modest analyst-revision event
  premium but not a Type-A candidate. Preserve the failed-negative revision
  lesson, keep the May 1, 2026 holdout sealed, make no live/capacity claim, and
  begin a materially different mechanism.
