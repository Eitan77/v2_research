    position_cap: 0.10

frozen_validation:
  exact_reproduction: "Source daily P&L, trade count, and total P&L must match."
  capacity_aware_removal:
    symbols: "Every allocated symbol."
    firms: "Five highest and five lowest net-contributing primary firms."
    events: "Ten highest and ten lowest allocated event P&Ls."
    entry_days: "Five highest and five lowest event-cohort P&Ls."
    method: "Remove from candidate set and rerun chronological allocation and marked-to-market P&L."
  moving_block_bootstrap:
    replications: 20000
    seed: 8005
    block_months: 3
    samples:
      - "Full 22-month development sequence"
      - "Representative recent 15-month sequence"
  rolling_windows_months: [3, 6, 12]
  adverse_cost_check: "Matched 20 bp per-side source variant."
  quote_replay_gate: >-
    Do not spend exact-event SIP quote budget when the candidate remains a
    bar-stage Type-A loser; quote validation cannot create missing alpha.
  expected_leave_one_out_resimulations: >-
    Determined from frozen source allocations as all symbols plus exactly
    10 firms, 20 events, and 10 entry days per profile.

required_outputs:
  - "Exact source reproduction and actual LOO count reconciliation"
  - "Worst/median/best LOO recent return and drawdown by profile/type"
  - "20,000-rep full/recent moving-block distributions and 10% probability"
  - "Rolling 3/6/12-month extrema and matched 20bp performance"
  - "Mandatory conclusion audit and explicit continue/retire decision"

