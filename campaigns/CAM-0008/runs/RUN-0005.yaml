role: "Adversarial dependence validation and stopping gate"
adaptation_label: "Three development-selected profiles; no untouched/OOS claim"

question: >-
  Do the best stable timing profiles survive exact capacity-aware removal and
  time-sequence uncertainty, and is there any credible chance that the
  measured mechanism reaches the Type-A return range under gross exposure
  capped at 1.0?
reason: >-
  Four runs tested the source baseline, causal subsets and states, sizing and
  overlap, reaction windows, entry latency, horizons, and costs. The remaining
  skeptical questions are contributor dependence, chronological instability,
  and whether the observed 2.6% recent average could plausibly mask a
  10%-15% process.
expected_effect: >-
  A credible modest event premium should remain positive after removing any
  symbol and the largest firm/event/day contributors. A Type-A-compatible
  process should show nontrivial mass near a 10% average month under a
  three-month moving-block bootstrap; zero probability and low upper
  quantiles would establish an economic return ceiling.

frozen_profiles:
  failed_negative_fast:
    source_variant: "negative_failure_long__w1__l3__ten_close__10bp__cap0.1"
    reaction_window_minutes: 1
    entry_latency_minutes: 3
    horizon: ten_close
    cost_bps_per_side: 10
    position_cap: 0.10
  failed_negative_slow:
