required_outputs:
  - "720/720 frozen/default/command/code/data/output reconciliation"
  - "Screen attrition by portfolio and missing-state attrition"
  - "Full/18/15/12-month net return, months, drawdown, recovery, and four blocks"
  - "Leg, action, clock, state, symbol, firm, event, and day concentration"
  - "Neighborhood rather than isolated-best diagnosis"
  - "A justified sizing/latency question or campaign-level rejection"

result:
  reconciliation: >-
    Passed 720/720 variants after three preserved fail-fast implementation
    attempts. The final command, frozen lists, code/data/catalog hashes, 499
    pre-cutoff QQQ rows, marked-to-market P&L, maximum date 2026-04-30, and
    zero holdout rows reconciled. Of 3,482 base long events, stock state was
    complete for all and QQQ state was missing for 23.
  best_central_variant: >-
    All long legs in the shifted high-stock-volatility state, ten-session exit,
    and 10 bp per side averaged 1.7511% per month over 15 months, 1.8786% over
    12 months, and 1.5770% full sample, with 9.84% drawdown, 24-day recovery,
    10 positive and five negative recent months, 1,404 allocations, 110
    symbols, and four positive coarse blocks. At 20 bp it retained 1.4906% per
    recent month and 10.35% drawdown.
  neighborhood: >-
    The unfiltered parent remained essentially tied at 1.7424% per recent
    month. QQQ-up, single-firm, close-location, standalone, QQQ-high-vol,
    intraday, target-only, reaction, gap, repetition, and participation
    screens did not create a materially stronger neighborhood; no central-cost
    variant reached 1.8% per recent month. Five- and three-session exits
    weakened sharply. The apparent best is therefore risk refinement rather
    than a new alpha level.
  allocation_diagnosis: >-
    At the unchanged 2% cap, ten-session close gross exposure averaged about
    79.9% for baseline but only 53.4% for high-stock-volatility, 42.3% for
    high-QQQ-volatility, 28.6% for gap-down, and 32.9% for low-participation
    screens. Selective variants leave enough causal capacity for a bounded
    sizing test.
decision: >-
  Do not select a narrow screen or promote. Carry the broad baseline and four
  interpretable risk/attention neighborhoods into a bounded 2%-10% position
  cap and portfolio-construction test. Retain ten sessions as the primary
  horizon, with five sessions as a turnover control, and keep 10/20 bp costs.
