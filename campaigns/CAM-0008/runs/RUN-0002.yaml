campaign_id: CAM-0008
run_id: RUN-0002
parent_run: RUN-0001
status: completed
frozen_at: "2026-07-29T07:05:00-07:00"
role: "Causal long-mechanism diagnosis"

question: >-
  Can observable analyst-action class, release clock, completed reaction
  quality, attention, gap context, broker repetition, or shifted stock/market
  state isolate a materially stronger and still distributed long edge?
reason: >-
  RUN-0001's all-long ten-session baseline was broad and positive in all four
  coarse blocks but averaged only 1.74% per recent month at 10 bp and had five
  negative months. Negative-action failure was the stronger isolated leg;
  protected intraday shorts all lost. The next informative step is to diagnose
  causal long subsets before changing sizing or execution.
expected_effect: >-
  Failed negative revisions may be strongest in target cuts, negative gaps,
  and low-attention reactions that the market subsequently rejects. Positive
  continuation may be strongest for rating actions, strong completed
  reactions, and high-attention states. Standalone and market-state variants
  test whether issuer news or regime exposure explains the baseline.

