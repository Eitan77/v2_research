run_id: RUN-0044
campaign_id: CAM-0600
parent_run: RUN-0043
status: completed
change: Prespecified formation-and-skip parameter-neighborhood search for the five
  quote-complete SMA families, followed by exact SIP target-change replay of the training-selected
  plateau centers and unchanged 126/21 controls.
reason: RUN-0043 varied breadth while freezing the cross-sectional ranking at 126-session
  momentum with a 21-session skip. Determine whether that rank is a stable region,
  whether a nearby economically standard horizon improves the strategies, and whether
  any apparent improvement survives chronological validation and marketable quote
  execution.
expected_effect: Shorter formation and skip values may capture recent leadership but
  increase turnover and reversals; longer values may be steadier but slower. A useful
  revision should improve more than one isolated cell and remain positive in the later
  chronological validation segment.
