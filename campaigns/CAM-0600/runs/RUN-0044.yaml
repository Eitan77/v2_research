- executed grid contains exactly 600 unique bar variants
- every weight row has gross exposure no greater than 1.0 and no negative position
- every selected cell is reproducible from the frozen training-only selection rule
- common comparison and chronological split dates are recorded by universe
- selected-versus-control sample and universe attrition is reported
- quote replay role coverage equals 100 percent before interpretation
executed_extensions:
- label: expanding_walkforward_diagnostic
  status: completed
  reason: Challenge the fixed-split result with a causal annual selector using only
    information before each evaluation year.
  expected_effect: A genuinely selectable parameter region should outperform the
    matched 126/21 path more often than isolated static cells do.
  paths: 20
  selection_timing: annual, expanding, minimum 252 prior common sessions
- label: posthoc_bar_dominance_diagnostic
  status: completed_development_only
  reason: Determine whether cells that beat 126/21 across full, validation, recent,
    drawdown, and 10-bp bar metrics form broad regions or isolated maxima.
  expected_effect: Broad neighboring regions may be useful mechanism leads; isolated
    cells should be treated as performance-mined diagnostics.
  cells_quote_replayed: 37
  adaptation_warning: The chronological validation segment participated in defining
    these cells, so none is untouched validation evidence.
- label: final_quote_replay
  status: completed
  unique_configurations: 95
  composition: 20 training selections, 20 unchanged controls, 20 expanding
    walk-forward paths, and 37 post-hoc cells, with duplicate static cells removed
decision: Retain 126/21 as the general default. The only training-selected static
  improvements that also improved full quote return, recent quote return, chronological
  validation, and drawdown were QQQ triple-MA top 3 at 126/5 and top 10 at 42/0.
  Treat the broader QQQ triple-MA faster-rank region as a development lead, not a
  promoted rule. The spectacular isolated post-hoc cells are not prospectively
  selectable, and expanding walk-forward selection underperformed 126/21 in 18 of
  20 matched quote paths. No promotion.
