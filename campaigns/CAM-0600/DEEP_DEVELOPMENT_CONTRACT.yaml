anti_overfit:
  - Use conventional horizons and small structured grids tied to the questions above.
  - Report every executed variant and the positive fraction, not only maxima.
  - Freeze recent 12, 15, and 18 month windows before looking at new results.
  - Require chronological folds and expanding walk-forward selection before quote spend.
  - Treat any recent-only winner as adapted development evidence requiring unchanged forward confirmation.
