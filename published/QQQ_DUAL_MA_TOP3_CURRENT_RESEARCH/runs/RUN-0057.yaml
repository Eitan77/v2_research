decision: >-
  The aggressive one-percent ladder is a genuine smoother but not a dominant
  replacement. It reduces drawdown, worst month, worst year, and two losing
  months, but sacrifices 15.84 full-history and 12.61 recent-12 return points,
  while increasing trade roles from 383 to 1,958. Preserve the control; retain
  this only as a lower-risk development sleeve if the user explicitly values
  smoother history over return.
