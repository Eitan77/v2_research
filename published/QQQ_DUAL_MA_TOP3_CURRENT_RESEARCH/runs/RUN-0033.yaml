decision: >-
  No exit overlay produces a holy-shit improvement. Preserve the unchanged
  weekly control. Rank5 is economically indistinguishable after quotes. Trim5
  is a possible consistency sleeve but gives up recent return and triples many
  adjustment roles. Stop5 is the strongest defensive expression, reducing
  drawdown and worst month while sacrificing full and recent return. Fixed
  take-profits and tight trailing exits amputate momentum winners.
