decision: >-
  Strong absolute momentum, volatility, liquidity, and distance above SMA200
  contain both the major winners and major losers; this supports preserving the
  right tail and using delayed ratchets rather than tight stops. Revenue growth
  and EPS growth are nonmonotonic and incomplete, relative volume is nonmonotonic,
  and market cap is invalid pending share-scale repair. Only the weak absolute
  momentum tail justifies a bounded prospective filter test.
