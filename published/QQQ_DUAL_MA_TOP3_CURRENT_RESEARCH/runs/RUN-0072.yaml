decision: >-
  Reject the five-session substitution rule as a validated risk improvement.
  The sparse 25-35 percent cells raise historical ending equity through path
  dependence, but none reduces the 41.99 percent drawdown or 15.07 percent worst
  month, and all three reduce recent12 compounded return by 4.28 points. The
  high-threshold return lift is too sparse and posthoc to outweigh the unchanged
  tail risk. Preserve control; forward-track the rule only if desired.
