decision: >-
  Reject uncapped proportional sizing as a replacement. Weekly uncapped improves
  recent return by 6.53 points but loses 7.37 full-history return points and adds
  4.96 drawdown points plus almost three times the order roles. Daily uncapped is
  dominated by daily equal weight on full return and drawdown and produces 5007
  order roles. Score magnitude does not contain enough stable incremental alpha
  to justify unrestricted concentration or continuous resizing.
