status: completed
change: Remove the 50 percent single-name cap from raw momentum-score proportional sizing and test it at weekly and daily rebalance cadences.
reason: Determine whether allowing signal strength to express itself without an arbitrary cap creates a material profit improvement, and whether daily score refresh captures that information faster.
expected_effect: Higher return if score magnitude contains incremental information; likely higher concentration, turnover, and drawdown, especially for daily rebalancing.
