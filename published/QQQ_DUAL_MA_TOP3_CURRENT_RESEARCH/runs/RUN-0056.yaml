decision: >-
  Reject progressive fixed profit ladders as replacements for the locked
  control. The requested 20 percent of original weight at every 5 percent gain
  reduced drawdown by only 0.54 points while sacrificing 10.16 full-history
  return points and 7.53 recent-12 points; worst month and month hit rate were
  unchanged. The gentler 20 percent every 10 percent rule was nearly neutral
  but still dominated after exact fills.
