  signal: unchanged_QQQ_PIT_SMA50_gt_SMA200_liquidity_top_half_rank_126_skip21_top3
  schedule: completed_Friday_signal_next_session_0940_execution
  execution: exact_SIP_0930_midpoint_to_0940_marketability_plus_2bps_per_side
  rebalance: every_scheduled_week
  capital_families:
    equity_linked:
      target_gross: min(equity, 1 + beta * max(equity - 1, 0))
      betas: [0.0, 0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9, 1.0]
      interpretation: cash buffer may refill losses as equity declines
    high_water_escrow:
