decision: >-
  Partial compounding forms a smooth return-risk frontier with no magic beta.
  Midrange 0.5-0.6 reinvestment materially reduces drawdown but necessarily
  gives up explosiveness. Permanent high-water escrow is generally dominated.
  May onward is post-observation diagnostic only.
