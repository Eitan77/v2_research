question: Can partial compounding retain most of the signal's explosiveness while materially reducing deployment tail risk?
diagnosis: >-
  Full compounding reinvests every profit dollar and produced roughly 42 to 45
  percent deployment drawdowns. Fixed original risk reduced drawdown to about
  18 percent but surrendered most recent upside. The most direct middle ground
  is to reinvest only a fixed fraction of profits at each weekly rebalance.
expected_effect: >-
  A smooth return-risk frontier. Midrange reinvestment fractions should retain
  substantial convex growth while building a cash buffer before reversals.
