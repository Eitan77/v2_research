run_id: RUN-0062
campaign_id: CAM-0611
parent_run: RUN-0061
status: completed
question: Can a causal portfolio drawdown governor preserve near-full compounding at highs while cutting exposure during genuine reversals?
diagnosis: >-
  Static partial compounding offers a smooth but costly return-risk tradeoff.
  Tail losses arrive after the account leaves a high-water mark, so a simple
  hysteretic governor may retain full or 75-percent compounding during advances
  and reduce reinvestment only after a material portfolio drawdown.
expected_effect: >-
  Better discovery return per unit drawdown than static beta, with fewer state
  flips than a one-week winner/loser rule. Late triggering may still leave the
  first loss leg unprotected and delayed re-risking may miss rebounds.
configuration:
  signal_execution_and_account: identical_to_RUN_0061
  normal_beta: [1.0, 0.75]
  defensive_beta: [0.0, 0.25, 0.5]
  drawdown_triggers: [0.05, 0.10, 0.15]
  recovery_threshold: one_half_of_trigger
  state_information: equity_available_at_scheduled_Monday_0940_before_rebalance
  target_gross: min(equity, 1 + active_beta * max(equity - 1, 0))
