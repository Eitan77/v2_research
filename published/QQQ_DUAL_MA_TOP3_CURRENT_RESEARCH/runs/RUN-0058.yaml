decision: >-
  The Monday-equalized deployment path is cash-valid and compounds strongly,
  but its true percentage drawdown is about 42.3 percent rather than the 17.5
  percent fixed-base research drawdown. Weekly equalization is also dominated
  over the full development history by equalizing only when membership changes,
  which ends higher with slightly lower drawdown and 38 percent fewer orders.
  Do not treat the fixed-base headline as live risk evidence and do not declare
  either deployment architecture live-ready without separately authorized
  frozen holdout reconciliation and forward paper execution.
