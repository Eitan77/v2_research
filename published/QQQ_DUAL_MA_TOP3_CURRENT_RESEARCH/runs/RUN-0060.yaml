question: Does a self-financing fixed-initial-risk budget preserve profits and materially reduce deployment drawdown?
authorization: User explicitly requested calculation and display on 2026-08-14.
diagnosis: >-
  Fully compounded deployment amplifies both gains and reversal losses. A fixed
  original risk budget can sweep gains to cash and use that cash to restore
  losing slots without broker margin.
expected_effect: >-
  Lower account-level drawdown and slower profit growth than compounding, with
  cash acting as a shock absorber after profitable periods.
