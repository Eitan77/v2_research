decision: >-
  The fixed initial risk budget is a coherent and substantially smoother live
  architecture. It reduced the observed May-August path from +45.40 percent
  with 44.61 percent drawdown under full compounding to +10.92 percent with
  10.40 percent drawdown, and reduced July from -32.76 to -7.46 percent. This
  is a return-for-risk tradeoff, not a free improvement, and May onward is
  post-observation evidence because the rule was proposed after seeing it.
