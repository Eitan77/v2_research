question: Can market information available by the Monday 09:40 execution predict the strategy's ensuing weekly cycle strongly enough to justify delaying entry?
diagnosis: >-
  Weekly strategy P&L states were not useful blockers. A broad-market opening
  shock or weak constituent breadth could identify a reversal regime using
  information available before the intended entry.
expected_effect: >-
  If a causal market-state blocker is genuine, weak Monday states should have
  materially negative subsequent strategy returns across thresholds and
  chronological partitions, and skipping them should improve fixed-base net
  profit and tail risk after execution costs.
