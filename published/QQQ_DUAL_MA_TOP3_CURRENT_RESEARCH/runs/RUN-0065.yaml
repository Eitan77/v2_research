decision: >-
  Preserve replacement-only as the leading self-financing deployment
  architecture challenger. It improves ending equity, drawdown, and turnover
  versus both weekly and membership-change equalization, and survives 10 bp.
  It is not promoted because the account allowed one name to reach 63.29 percent
  and spent 501 sessions above 50 percent single-name weight. A broad prospective
  concentration-boundary test is the next unresolved capital question.
