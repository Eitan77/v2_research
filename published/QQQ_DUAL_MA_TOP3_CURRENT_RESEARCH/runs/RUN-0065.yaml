question: Does replacement-only cash handling preserve persistent winners better than equalizing the portfolio when membership changes?
diagnosis: >-
  Even change-only equalization trims continuing winners whenever one name leaves.
  A literal replacement-only account should sell outgoing names, divide available
  proceeds among entrants, and leave continuing positions untouched.
expected_effect: >-
  Lower turnover and stronger continuation capture, with greater position drift
  and potentially worse single-name concentration and drawdown.
