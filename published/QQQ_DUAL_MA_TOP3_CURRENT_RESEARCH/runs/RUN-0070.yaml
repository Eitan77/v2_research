decision: >-
  The comparison is not reassuring at extreme five-day heat: above 25 percent,
  only two of seven independent strategy weeks were positive and the median was
  -3.12 percent; the sole prior 35-percent case lost 20.25 percent at portfolio
  level the next week. Samples are too small and the condition is posthoc, so
  this cannot justify a new veto or retuning rule. It does identify Monday as a
  materially higher-risk initiation than an ordinary frozen-signal week.

