decision: >-
  Do not promote the 25 percent momentum floor despite the +405.53 percent
  combined headline. Its entire +24.50-point standalone improvement occurs in
  2022 and it has zero effect in every other year, including recent12. Tightened
  liquidity, relative-volume filters, trend-distance filters, and blended ranks
  all failed. Preserve the floor only as a regime-specific diagnostic.
